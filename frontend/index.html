<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- ── Base SEO (overridden per-page by react-helmet-async) ── -->
    <title>WarScope — War Scope Global Military Intelligence</title>
    <meta name="description" content="WarScope is your war scope global intelligence platform. Real-time global conflict visualization, military power rankings, arms trade data, nuclear arsenals, and intelligence briefings. Track every war scope worldwide." />
    <meta name="keywords" content="war scope, war scope global, warscopeglobal, global military intelligence, conflict map, military power rankings, arms trade, nuclear arsenals, intelligence briefings, real-time conflict tracking, war tracker, global conflict visualization" />
    <meta name="author" content="WarScope Global" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://warscopeglobal.com/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- ── Structured Data (JSON-LD) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "WarScope Global",
      "alternateName": ["War Scope", "War Scope Global", "WarScope"],
      "url": "https://warscopeglobal.com/",
      "description": "War Scope Global — real-time military intelligence, conflict visualization, power rankings, and arms trade data.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://warscopeglobal.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Open Graph base (overridden per-page) ── -->
    <meta property="og:site_name"   content="WarScope Global" />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="WarScope — War Scope Global Military Intelligence" />
    <meta property="og:description" content="WarScope is your war scope global intelligence platform. Real-time conflict visualization, military power rankings, arms trade data, nuclear arsenals, and intelligence briefings." />
    <meta property="og:image"       content="https://warscopeglobal.com/og-default.jpg" />
    <meta property="og:url"         content="https://warscopeglobal.com/" />

    <!-- ── Twitter Card base ── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@warscopeglobal" />
    <meta name="twitter:title"       content="WarScope — War Scope Global Military Intelligence" />
    <meta name="twitter:description" content="WarScope is your war scope global intelligence platform. Real-time conflict visualization, military power rankings, arms trade data, and intelligence briefings." />
    <meta name="twitter:image"       content="https://warscopeglobal.com/og-default.jpg" />

    <!-- ── Theme color (browser chrome on mobile) ── -->
    <meta name="theme-color" content="#050508" />

    <!-- ── Google Fonts ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet" />
